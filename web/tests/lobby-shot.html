<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TudásKerék – szobalista és PIN-választó (kép)</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <!--
    Csak képernyőkép készítéséhez: a nyitott szobák listája és a görgetős
    PIN-választó, valódi adat és backend nélkül.
      node tools/src/shot-lobby.mjs
  -->
  <!-- A VALÓDI alkalmazásvázat kell utánozni (`#app` > felső sáv > `.viewport`),
       különben a `.viewport` magassága kötetlen, és a fix magasságú
       kérdésképernyő `height: 100%`-a nem érvényesül. Enélkül a kiférés-mérés
       hamis zöldet adna: rövid tartalom miatt „elfér”, nem azért, mert a
       szabály működik. -->
  <div id="app">
    <div class="top-bar"><span class="app-title">TudásKerék</span></div>
    <!-- A képernyő KÖZVETLENÜL a `.viewport` gyermeke, ahogy a valódi
         alkalmazásban is: egy közbeiktatott réteg megtörné a magasság
         leterjedését, és a mérés hamis zöldet adna. -->
    <div id="host" class="viewport"></div>
  </div>

  <script type="module">
    import { multiplayerScreen, roomScreen } from '../js/multiplayer.js';
    import { QuestionBank } from '../js/api.js';

    const bank = new QuestionBank();
    await bank.load();

    const ROOMS = [
      { id: 'r1', host_nickname: 'Anna', host_avatar: 'fox', host_is_guest: false,
        max_players: 4, rounds_per_player: 10, answer_seconds: 15,
        questions_per_category: 1, difficulty: null,
        created_at: new Date().toISOString(), needs_pin: true,
        player_count: 2, i_am_in: false },
      { id: 'r2', host_nickname: 'Cili', host_avatar: 'cat', host_is_guest: true,
        max_players: 3, rounds_per_player: 5, answer_seconds: 20,
        questions_per_category: 10, difficulty: 'easy',
        created_at: new Date().toISOString(), needs_pin: false,
        player_count: 1, i_am_in: false },
      { id: 'r3', host_nickname: 'Dóra', host_avatar: 'owl', host_is_guest: false,
        max_players: 2, rounds_per_player: 3, answer_seconds: 30,
        questions_per_category: 1, difficulty: 'hard',
        created_at: new Date().toISOString(), needs_pin: true,
        player_count: 2, i_am_in: false }
    ];

    const app = {
      bank,
      supabase: {
        isConfigured: true, isSignedIn: true, isAnonymous: true, userId: 'me',
        signInAnonymously: async () => ({}),
        // A szobalista lekérése előtt a képernyő a szervertől kérdezi meg,
        // vendég-e a fiók. Enélkül a mock hívása kivételt dobott, és a lista
        // üresen maradt – a képernyőkép is üres szobalistát mutatott.
        isGuestAccount: async () => true,
        rpc: async (name) => (name === 'list_open_rooms' ? ROOMS : {})
      },
      sync: { scoringRules: async () => ({}), run: async () => {} },
      navigate: () => {},
      refreshCurrentScreen: () => {},
      pushProfile: () => {}
    };

    const host = document.getElementById('host');

    // #spin → a pörgetés fázisa; #answer → a válaszfázis (a kérdés + 4 válasz);
    // #answer5 → ugyanaz ÖT játékossal és hosszú kérdéssel, hogy a szűk eset is
    // mérhető legyen (kiférés-ellenőrzés a layout-check.html-ben).
    if (location.hash === '#spin' || location.hash.startsWith('#answer') || location.hash.startsWith('#resolved')) {
      const isAnswer = location.hash.startsWith('#answer');
      const isResolved = location.hash.startsWith('#resolved');
      // #resolved5 → lezárt kérdés, ÖT játékossal, mindegyik más választ adott
      // (a legrosszabb eset: minden válasznál van legalább egy szavazó
      // avatar, ez méri, hogy az avatarcsík sem töri meg a fix magasságot).
      const crowded = location.hash === '#answer5' || location.hash === '#resolved5';
      const now = Date.now();
      const extraPlayers = [
        { player_id: 'd', seat: 4, score: 5000, block_score: 1000, is_ready: true,
          is_eliminated: false, has_left: false, nickname: 'Dorka', avatar_id: 'bear', is_guest: false },
        { player_id: 'e', seat: 5, score: 3000, block_score: 0, is_ready: true,
          is_eliminated: true, has_left: false, nickname: 'Elemér', avatar_id: 'wolf', is_guest: true }
      ];
      const room = {
        id: 'r', host_id: 'me', status: 'playing',
        max_players: 5, rounds_per_player: 10, difficulty: null,
        block_no: 3, questions_per_category: 10,
        answer_seconds: 15, reveal_seconds: 5, spin_seconds: 6,
        max_questions: 10, has_pin: true, my_pin: null, i_am_guest: false,
        server_time: new Date(now).toISOString(),
        reactions: [],
        current_round: {
          category_slug: 'magyar-tortenelem', category_name: 'Magyar történelem',
          answered_questions: 0, questions_in_round: 10
        },
        current_question: {
          id: 'rq',
          question_text: crowded
            ? 'Melyik évben zajlott az a csata, amely a középkori magyar állam ' +
              'hanyatlásának egyik legfontosabb fordulópontjaként vonult be a köztudatba?'
            : 'Melyik évben volt a mohácsi csata?',
          answers: crowded
            ? ['1514, a Dózsa-féle parasztfelkelés éve',
               '1526, a mohácsi csata éve',
               '1541, Buda török kézre kerülése',
               '1552, a végvári harcok egyik éve']
            : ['1514', '1526', '1541', '1552'],
          difficulty: 'easy',
          category_slug: 'magyar-tortenelem', ordinal: 1, max_questions: 10,
          reward: 1000,
          // Válaszfázisban a válaszablak MÁR nyitva van, pörgetésnél még nem.
          answer_open_at: new Date(now + (isAnswer || isResolved ? -1000 : 3200)).toISOString(),
          deadline_at: new Date(now + (isAnswer ? 12000 : 18200)).toISOString(),
          resolved: isResolved,
          resolved_at: isResolved ? new Date(now - 500).toISOString() : null,
          my_answer: isResolved ? 1 : null,
          i_answered: isResolved,
          answered_count: isResolved ? (crowded ? 5 : 3) : 0,
          alive_count: crowded ? 5 : 4,
          correct_answer: isResolved ? 1 : null,
          explanation: isResolved ? '1526. augusztus 29-én a magyar sereg vereséget szenvedett.' : null,
          results: isResolved
            ? (crowded
                ? [
                    { player_id: 'me', selected_answer: 1, is_correct: true, awarded_points: 1000 },
                    { player_id: 'a', selected_answer: 1, is_correct: true, awarded_points: 1000 },
                    { player_id: 'c', selected_answer: 0, is_correct: false, awarded_points: 0 },
                    { player_id: 'd', selected_answer: 2, is_correct: false, awarded_points: 0 },
                    { player_id: 'e', selected_answer: 3, is_correct: false, awarded_points: 0 }
                  ]
                : [
                    { player_id: 'me', selected_answer: 1, is_correct: true, awarded_points: 1000 },
                    { player_id: 'a', selected_answer: 1, is_correct: true, awarded_points: 1000 },
                    { player_id: 'c', selected_answer: 2, is_correct: false, awarded_points: 0 }
                  ])
            : null
        },
        last_block_scores: null, last_block_ended_at: null,
        players: [
          { player_id: 'me', seat: 1, score: 4000, block_score: 0, is_ready: true,
            is_eliminated: false, has_left: false, nickname: 'Te', avatar_id: 'fox', is_guest: false },
          { player_id: 'a', seat: 2, score: 7000, block_score: 0, is_ready: true,
            is_eliminated: false, has_left: false, nickname: 'Anna', avatar_id: 'owl', is_guest: false },
          { player_id: 'c', seat: 3, score: 2000, block_score: 0, is_ready: true,
            is_eliminated: false, has_left: false, nickname: 'Cili', avatar_id: 'cat', is_guest: true },
          ...(crowded ? extraPlayers : [])
        ]
      };
      host.append(
        roomScreen(
          { ...app, supabase: { ...app.supabase, userId: 'me', rpc: async () => room } },
          { room }
        )
      );
      // Pörgetésnél hagyjuk lefutni a kerék animációját, hogy a kép a
      // kategóriát mutassa; válaszfázisban nincs mire várni.
      await new Promise((resolve) => setTimeout(resolve, isAnswer ? 400 : 3600));
      document.body.dataset.ready = 'true';
    } else {
      host.append(multiplayerScreen(app));
    }

    // Megvárjuk a lista kirajzolását, majd megnyitjuk a PIN-párbeszédet, ha a
    // címben kérték – így két különböző kép készíthető ugyanerről a lapról.
    if (location.hash === '#spin') { /* fentebb már kész */ }
    else await new Promise((resolve) => setTimeout(resolve, 300));
    if (location.hash === '#pin') {
      host.querySelectorAll('.room-item')[0]?.click();
      await new Promise((resolve) => setTimeout(resolve, 400));
    }
    // #create → a szoba létrehozó párbeszéd. Ez a LEGHOSSZABB párbeszéd
    // (4 léptető + nehézség + PIN-kapcsoló + számválasztó), ezért ezen
    // mérjük, hogy a gombsor telefonon is elérhető marad-e.
    if (location.hash === '#create') {
      [...host.querySelectorAll('button')]
        .find((b) => b.textContent.includes('Új szoba'))
        ?.click();
      await new Promise((resolve) => setTimeout(resolve, 400));
    }
    document.body.dataset.ready = 'true';
  </script>
</body>
</html>
