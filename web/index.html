<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover + safe-area padding: iPhone-on a kivágás („notch”) és a
       home indikátor alatt se csússzon el a felület -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
  <title>TudásKerék – magyar kvízjáték</title>
  <meta name="description"
        content="Magyar nyelvű kvízjáték szerencsekerékkel: pörgess, válaszolj, és döntsd el, hogy megállsz vagy kockáztatsz. Offline is működik.">

  <!-- A téma világos krém. A `color-scheme: dark` maradvány volt a régi lila
       palettából, és VALÓDI HIBÁT okozott: a böngésző ilyenkor sötétre festi a
       saját vásznát, ezért a body által nem takart részen (pl. amikor a
       címsáv el-eltűnik, vagy visszatéréskor a layout átmenetileg alacsonyabb)
       fekete sáv jelent meg alul. -->
  <meta name="theme-color" content="#fbf6ec">
  <meta name="color-scheme" content="light">

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest">

  <!-- iOS: a home screenről indított webalkalmazás teljes képernyőn fut, és
       mentesül a Safari 7 napos tárolótörlési szabálya alól -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TudásKerék">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">

  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <!-- Az alkalmazás JavaScriptből épül fel; ez csak az induló állapot. -->
    <div class="spinner-wrap"><div class="spinner"></div><span>Indulás…</span></div>
  </div>

  <noscript>
    <div class="boot-error">
      <h2>JavaScript szükséges</h2>
      <p>A játék JavaScript nélkül nem működik. Engedélyezd a böngészőben.</p>
    </div>
  </noscript>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
