# A PWA közzététele GitHub Pages-re.
#
# Mit tesz:
#   1. validálja a kérdésbankot és lefuttatja a teszteket (játéklogika +
#      migrációk igazi Postgresen),
#   2. összeállítja a kérdésbankot és az ikonokat,
#   3. a web/ mappát kirakja GitHub Pages-re.
#
# EGYSZERI BEÁLLÍTÁS A GITHUBON – enélkül a deploy „Not Found” hibával elhasal:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# Ha a "GitHub Actions" nem választható, a repó privát egy olyan csomagon, ahol
# a Pages nem elérhető. Tedd publikussá (Settings → General → Change visibility),
# vagy használj Cloudflare Pages-t.
#
# Miért nincs itt `actions/configure-pages`? Mert annak csak statikus
# oldalgenerátorokhoz (Next, Nuxt, Gatsby…) van dolga: base_url-t számol és
# konfigot ír. Ez a projekt sima statikus fájlokat tesz közzé, tehát a lépés
# nem tesz semmit – viszont ő adta a legrejtélyesebb hibaüzenetet, ha a Pages
# nem volt bekapcsolva.

name: Közzététel (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

# A Pages deployhoz ezek a jogosultságok kellenek.
permissions:
  contents: read
  pages: write
  id-token: write

# Egyszerre egy deploy fusson; a futó deployt nem szakítjuk meg.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Kérdésbank validálása
        run: node tools/src/validate-seed.mjs

      - name: Játéklogika tesztek
        run: node --test web/tests/rules.test.mjs

      # A migrációk és a szerveroldali multiplayer logika igazi Postgresen
      # (PGlite = Postgres WebAssemblyre fordítva). Így egy hibás migráció nem
      # jut el a Supabase-ig.
      - name: Adatbázis-eszközök telepítése
        run: npm ci --no-audit --no-fund
        working-directory: tools

      - name: Migrációk és multiplayer logika tesztje
        run: node tools/src/db-test.mjs

      - name: Kérdésbank összeállítása
        run: node tools/src/build-seed.mjs

      - name: Ikonok generálása
        run: node tools/src/make-icon.mjs

      - name: Hivatkozott fájlok ellenőrzése
        run: node tools/src/serve.mjs web --check

      - name: Feltöltés
        uses: actions/upload-pages-artifact@v5
        with:
          path: web
          # A web/.nojekyll pont-fájl, ezt enélkül kihagyná a csomagból.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
