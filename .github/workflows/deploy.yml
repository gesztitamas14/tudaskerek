# A PWA közzététele GitHub Pages-re.
#
# Mit tesz:
#   1. összeállítja a kérdésbankot a content/seed/*.json fájlokból,
#   2. legenerálja az ikonokat,
#   3. lefuttatja a validációt és a játéklogika tesztjeit,
#   4. a web/ mappát kirakja GitHub Pages-re.
#
# Egyszeri beállítás a GitHubon:
#   Settings → Pages → Source: "GitHub Actions"
#
# Ezután minden main-re küldött push automatikusan frissíti az oldalt.

name: Közzététel (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

# A Pages deployhoz ezek a jogosultságok kellenek.
permissions:
  contents: read
  pages: write
  id-token: write

# Egyszerre egy deploy fusson; a futó deployt nem szakítjuk meg.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Kérdésbank validálása
        run: node tools/src/validate-seed.mjs

      - name: Játéklogika tesztek
        run: node --test web/tests/rules.test.mjs

      # A migrációk és a szerveroldali multiplayer logika igazi Postgresen
      # (PGlite = Postgres WebAssemblyre fordítva). Így egy hibás migráció nem
      # jut el a Supabase-ig.
      - name: Adatbázis-eszközök telepítése
        run: npm install --no-audit --no-fund
        working-directory: tools

      - name: Migrációk és multiplayer logika tesztje
        run: node tools/src/db-test.mjs

      - name: Kérdésbank összeállítása
        run: node tools/src/build-seed.mjs

      - name: Ikonok generálása
        run: node tools/src/make-icon.mjs

      - name: Hivatkozott fájlok ellenőrzése
        run: node tools/src/serve.mjs web --check

      - name: Pages beállítás
        uses: actions/configure-pages@v5

      - name: Feltöltés
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
